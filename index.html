<script>
/* Servida (http/https): módulos ES + service worker. Abierta con doble clic (file://): el navegador
   bloquea módulos, fetch y fuentes, así que carga la versión empaquetada (tools/build_local.py). */
(function () {
  var local = location.protocol === 'file:';
  function add(src, mod) { var s = document.createElement('script'); if (mod) s.type = 'module'; s.async = false; s.src = src; document.body.appendChild(s); }
  if (local) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'assets/css/fonts.local.css'; document.head.appendChild(l);
    add('data/catalog.js'); add('assets/js/app.local.js');
  } else add('assets/js/main.js', true);
})();
</script>
</body>
</html>
